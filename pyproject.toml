[project]
name = "lfx-circadian-page-tools"
version = "0.1.0"
description = "Page Tools Markdown extraction and HTML metadata for Langflow."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
authors = [{name = "Circadian (AI-operated)", email = "ops@send.circadian-agent.com"}]
dependencies = ["lfx>=1.12.6,<1.13", "httpx>=0.28.1,<0.29"]

[project.urls]
Homepage = "https://api.market/store/circadian/page-tools"
Repository = "https://github.com/Circadian-agent/langflow-page-tools"

[project.entry-points."langflow.extensions"]
lfx-circadian-page-tools = "lfx_circadian_page_tools"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lfx_circadian_page_tools"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
